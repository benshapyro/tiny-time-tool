name: CI

on:
  push:
    branches: [main]
  pull_request:

# Zero network by the *app* (BUILD_SPEC Constraints) — this workflow itself
# still needs the package registries, GitHub, and Rust's crates.io to build.
# That's the CI environment, not the shipped app; the CSP + source scan +
# deps allowlist checks below are what prove the app itself never connects.

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck

      - name: Vitest (unit + component tests, incl. CSP golden-file test)
        run: npm test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # Zero-network mechanism (b): dependency allowlist.
      - name: Check dependency allowlist
        run: node scripts/check-deps-allowlist.mjs

      # Zero-network mechanism (c): source scan.
      - name: Check zero-network source scan
        run: node scripts/check-zero-network.mjs

      # Browser-safety: a Node built-in imported into the frontend bundle
      # aborts the module graph at runtime while `vite build` still exits 0.
      # S2 shipped exactly that (`node:crypto`) past every other gate.
      - name: Check browser-safe imports
        run: node scripts/check-browser-safe-imports.mjs

      # Unsigned by design (BUILD_SPEC Non-goals: "No code signing in v1").
      # Neither platform has a signing identity configured here, and the
      # Tauri bundler doesn't require one — this must not fail the build.
      # macOS builds default to the host arch only (no --target flag), which
      # keeps the runner fast per BUILD_SPEC S1.
      - name: tauri build
        run: npm run tauri build

      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tiny-time-tool-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows .msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tiny-time-tool-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows .exe (NSIS)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tiny-time-tool-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
